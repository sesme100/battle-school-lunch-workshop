# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: battle-school-lunch
metadata:
  template: battle-school-lunch@0.1.0

infra:
  provider: bicep
  path: ./infra
  module: main

services:
  backend:
    project: ./backend
    language: docker
    host: containerapp
    apiVersion: 2024-03-01
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

  frontend:
    project: ./frontend
    language: docker
    host: containerapp
    apiVersion: 2024-03-01
    uses:
      - backend
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
